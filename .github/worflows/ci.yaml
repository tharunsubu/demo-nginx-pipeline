name: Nginx CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. SAST / SOURCE CODE SECURITY SCAN
  # ==========================================
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep@v1
        with:
          args: --config auto .


  # ==========================================
  # 2. DOCKER BUILD
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: sast

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t demo-nginx:${{ github.sha }} \
            .


  # ==========================================
  # 3. TRIVY CONTAINER SECURITY SCAN
  # ==========================================
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t demo-nginx:${{ github.sha }} \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: demo-nginx:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


  # ==========================================
  # 4. RUN CONTAINER AND TEST
  # ==========================================
  container-test:
    name: Nginx Container Test
    runs-on: ubuntu-latest

    needs: trivy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t demo-nginx:${{ github.sha }} \
            .

      - name: Start Nginx container
        run: |
          docker run -d \
            --name demo-nginx \
            -p 8080:80 \
            demo-nginx:${{ github.sha }}

      - name: Wait for Nginx
        run: |
          sleep 5

      - name: Test application
        run: |
          curl --fail http://localhost:8080

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8080/health

      - name: Stop container
        if: always()
        run: |
          docker stop demo-nginx || true
          docker rm demo-nginx || true